name: CI Release Gate

on:
  push:
    branches:
      - master
      - develop
  pull_request:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: ci-release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rsh_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/rsh_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci_jwt_access_secret_at_least_32_chars_long____
      JWT_REFRESH_SECRET: ci_jwt_refresh_secret_at_least_32_chars_long___
      JWT_KEY_ID: ci-key-1
      REFRESH_TOKEN_PEPPER: ci_refresh_pepper_1234567890
      ACCESS_TOKEN_TTL_SECONDS: "900"
      REFRESH_TOKEN_TTL_DAYS: "14"
      COOKIE_DOMAIN: localhost
      STRIPE_SECRET_KEY: sk_test_ci_dummy_key
      STRIPE_WEBHOOK_SECRET: whsec_ci_dummy_secret
      STRIPE_PRICE_CURRENCY: usd
      STORE_USD_TO_RUB_RATE: "90"
      PLAYWRIGHT_TEST: "1"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rsh_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rsh_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        id: setup_node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        id: install_dependencies
        run: npm ci

      - name: Install Playwright browser
        id: install_playwright
        run: npx playwright install --with-deps chromium

      - name: Prepare database
        id: prepare_database
        run: |
          start=$(date +%s%3N)
          set +e
          npm run prisma:generate && npm run prisma:deploy && npm run seed
          status=$?
          end=$(date +%s%3N)
          echo "duration_ms=$((end-start))" >> "$GITHUB_OUTPUT"
          exit $status

      - name: Run DB preflight
        id: db_preflight
        run: |
          start=$(date +%s%3N)
          set +e
          npm run db:preflight
          status=$?
          end=$(date +%s%3N)
          echo "duration_ms=$((end-start))" >> "$GITHUB_OUTPUT"
          exit $status

      - name: Run typecheck
        id: typecheck
        run: |
          start=$(date +%s%3N)
          set +e
          npm run typecheck
          status=$?
          end=$(date +%s%3N)
          echo "duration_ms=$((end-start))" >> "$GITHUB_OUTPUT"
          exit $status

      - name: Run lint
        id: lint
        run: |
          start=$(date +%s%3N)
          set +e
          npm run lint
          status=$?
          end=$(date +%s%3N)
          echo "duration_ms=$((end-start))" >> "$GITHUB_OUTPUT"
          exit $status

      - name: Run unit tests
        id: unit_tests
        run: |
          start=$(date +%s%3N)
          set +e
          npm run test
          status=$?
          end=$(date +%s%3N)
          echo "duration_ms=$((end-start))" >> "$GITHUB_OUTPUT"
          exit $status

      - name: Run build
        id: build
        env:
          APP_URL: https://rsh.example
          COOKIE_DOMAIN: rsh.example
          STRIPE_SECRET_KEY: sk_live_ci_placeholder_key
          UPLOADTHING_TOKEN: ci-uploadthing-token
          UPLOADTHING_APP_ID: ci-uploadthing-app-id
        run: |
          start=$(date +%s%3N)
          set +e
          npm run build
          status=$?
          end=$(date +%s%3N)
          echo "duration_ms=$((end-start))" >> "$GITHUB_OUTPUT"
          exit $status

      - name: Run E2E security gate
        id: e2e_security
        run: |
          start=$(date +%s%3N)
          set +e
          npm run test:e2e:security
          status=$?
          end=$(date +%s%3N)
          echo "duration_ms=$((end-start))" >> "$GITHUB_OUTPUT"
          exit $status

      - name: Run E2E smoke
        id: e2e_smoke
        run: |
          start=$(date +%s%3N)
          set +e
          npm run test:e2e:smoke
          status=$?
          end=$(date +%s%3N)
          echo "duration_ms=$((end-start))" >> "$GITHUB_OUTPUT"
          exit $status

      - name: Build CI release gate report
        if: ${{ always() }}
        env:
          PREPARE_DATABASE_OUTCOME: ${{ steps.prepare_database.outcome }}
          PREPARE_DATABASE_DURATION: ${{ steps.prepare_database.outputs.duration_ms }}
          DB_PREFLIGHT_OUTCOME: ${{ steps.db_preflight.outcome }}
          DB_PREFLIGHT_DURATION: ${{ steps.db_preflight.outputs.duration_ms }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          TYPECHECK_DURATION: ${{ steps.typecheck.outputs.duration_ms }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          LINT_DURATION: ${{ steps.lint.outputs.duration_ms }}
          UNIT_TESTS_OUTCOME: ${{ steps.unit_tests.outcome }}
          UNIT_TESTS_DURATION: ${{ steps.unit_tests.outputs.duration_ms }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          BUILD_DURATION: ${{ steps.build.outputs.duration_ms }}
          E2E_SECURITY_OUTCOME: ${{ steps.e2e_security.outcome }}
          E2E_SECURITY_DURATION: ${{ steps.e2e_security.outputs.duration_ms }}
          E2E_SMOKE_OUTCOME: ${{ steps.e2e_smoke.outcome }}
          E2E_SMOKE_DURATION: ${{ steps.e2e_smoke.outputs.duration_ms }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          node - <<'NODE'
          const fs = require("fs");

          const toDuration = (value) => {
            const parsed = Number.parseInt(value ?? "", 10);
            return Number.isFinite(parsed) ? parsed : null;
          };

          const steps = {
            prepare_database: {
              status: process.env.PREPARE_DATABASE_OUTCOME ?? "skipped",
              durationMs: toDuration(process.env.PREPARE_DATABASE_DURATION)
            },
            db_preflight: {
              status: process.env.DB_PREFLIGHT_OUTCOME ?? "skipped",
              durationMs: toDuration(process.env.DB_PREFLIGHT_DURATION)
            },
            typecheck: {
              status: process.env.TYPECHECK_OUTCOME ?? "skipped",
              durationMs: toDuration(process.env.TYPECHECK_DURATION)
            },
            lint: {
              status: process.env.LINT_OUTCOME ?? "skipped",
              durationMs: toDuration(process.env.LINT_DURATION)
            },
            unit_tests: {
              status: process.env.UNIT_TESTS_OUTCOME ?? "skipped",
              durationMs: toDuration(process.env.UNIT_TESTS_DURATION)
            },
            build: {
              status: process.env.BUILD_OUTCOME ?? "skipped",
              durationMs: toDuration(process.env.BUILD_DURATION)
            },
            e2e_security: {
              status: process.env.E2E_SECURITY_OUTCOME ?? "skipped",
              durationMs: toDuration(process.env.E2E_SECURITY_DURATION)
            },
            e2e_smoke: {
              status: process.env.E2E_SMOKE_OUTCOME ?? "skipped",
              durationMs: toDuration(process.env.E2E_SMOKE_DURATION)
            }
          };

          const gateOrder = [
            "prepare_database",
            "db_preflight",
            "typecheck",
            "lint",
            "unit_tests",
            "build",
            "e2e_security",
            "e2e_smoke"
          ];
          const gatePassed = gateOrder.every((key) => steps[key].status === "success");
          const totalDurationMs = gateOrder.reduce((acc, key) => {
            const value = steps[key].durationMs;
            return typeof value === "number" ? acc + value : acc;
          }, 0);

          const report = {
            workflow: process.env.WORKFLOW_NAME,
            runId: process.env.RUN_ID,
            runNumber: process.env.RUN_NUMBER,
            sha: process.env.SHA,
            refName: process.env.REF_NAME,
            actor: process.env.ACTOR,
            repository: process.env.REPOSITORY,
            runUrl: `${process.env.SERVER_URL}/${process.env.REPOSITORY}/actions/runs/${process.env.RUN_ID}`,
            generatedAt: new Date().toISOString(),
            status: gatePassed ? "passed" : "failed",
            totalDurationMs,
            steps
          };

          fs.writeFileSync("ci-release-gate-report.json", JSON.stringify(report, null, 2));
          NODE

      - name: Upload CI release gate report artifact
        id: upload_release_report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-release-gate-report-${{ github.run_id }}
          path: ci-release-gate-report.json
          if-no-files-found: error

      - name: Upload Playwright artifacts
        id: upload_playwright_artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-release-gate-playwright-${{ github.run_id }}
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish release gate summary comment
        if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false }}
        uses: actions/github-script@v7
        env:
          REPORT_PATH: ci-release-gate-report.json
          ARTIFACT_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/${{ steps.upload_release_report.outputs.artifact-id }}
          PLAYWRIGHT_ARTIFACT_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/${{ steps.upload_playwright_artifacts.outputs.artifact-id }}
        with:
          script: |
            const fs = require("fs");
            const report = JSON.parse(fs.readFileSync(process.env.REPORT_PATH, "utf8"));
            const marker = "<!-- rsh-release-gate-summary -->";
            const orderedStepKeys = [
              "prepare_database",
              "db_preflight",
              "typecheck",
              "lint",
              "unit_tests",
              "build",
              "e2e_security",
              "e2e_smoke"
            ];
            const stepMeta = {
              prepare_database: {
                label: "Prepare database",
                next: "Проверь DATABASE_URL/DIRECT_URL, postgres-сервис и prisma migrate deploy output."
              },
              db_preflight: {
                label: "DB preflight",
                next: "Запусти `npm run db:preflight` локально и исправь миграции/схему."
              },
              typecheck: {
                label: "Typecheck",
                next: "Запусти `npm run typecheck` локально и исправь TS ошибки."
              },
              lint: {
                label: "Lint",
                next: "Запусти `npm run lint` и исправь замечания линтера."
              },
              unit_tests: {
                label: "Unit tests",
                next: "Запусти `npm run test` локально и устрани упавшие unit-тесты."
              },
              build: {
                label: "Build",
                next: "Запусти `npm run build` и проверь production env constraints."
              },
              e2e_security: {
                label: "E2E security gate",
                next: "Запусти `npm run test:e2e:security` и исправь security-regression сценарий."
              },
              e2e_smoke: {
                label: "E2E smoke",
                next: "Запусти `npm run test:e2e:smoke` и проверь API/UI критичный контур."
              }
            };

            const toEmoji = (status) => {
              if (status === "success") return "[OK]";
              if (status === "failure") return "[FAIL]";
              if (status === "cancelled") return "[CANCEL]";
              return "[SKIP]";
            };

            const formatDuration = (value) => {
              if (typeof value !== "number" || Number.isNaN(value)) {
                return "-";
              }
              return `${(value / 1000).toFixed(2)}s`;
            };

            const stepRows = orderedStepKeys
              .map((key) => [stepMeta[key].label, report.steps[key]])
              .map(([name, step]) => `| ${name} | ${toEmoji(step.status)} \`${step.status}\` | ${formatDuration(step.durationMs)} |`)
              .join("\n");
            const totalGateTime = formatDuration(report.totalDurationMs);
            const slowestSteps = orderedStepKeys
              .map((key) => ({
                label: stepMeta[key].label,
                durationMs: report.steps[key].durationMs
              }))
              .filter((step) => typeof step.durationMs === "number" && !Number.isNaN(step.durationMs))
              .sort((a, b) => b.durationMs - a.durationMs)
              .slice(0, 3);
            const slowestStepLines = slowestSteps.length > 0
              ? slowestSteps.map((step, index) => `${index + 1}. ${step.label} - ${formatDuration(step.durationMs)}`).join("\n")
              : "1. N/A";

            const firstFailedKey = orderedStepKeys.find((key) => {
              const status = report.steps[key].status;
              return status === "failure" || status === "cancelled";
            });

            const failedStepBlock = firstFailedKey
              ? `### What failed next\n- Step: \`${stepMeta[firstFailedKey].label}\`\n- Action: ${stepMeta[firstFailedKey].next}\n`
              : "### What failed next\n- No failed steps detected.\n";
            const hasPlaywrightArtifacts = Boolean(
              process.env.PLAYWRIGHT_ARTIFACT_URL &&
              !process.env.PLAYWRIGHT_ARTIFACT_URL.endsWith("/artifacts/")
            );
            const playwrightArtifactsLine = hasPlaywrightArtifacts
              ? `[ci-release-gate-playwright](${process.env.PLAYWRIGHT_ARTIFACT_URL})`
              : "not available";

            const summaryBadge = report.status === "passed" ? "[OK] PASSED" : "[FAIL] FAILED";
            const body = `${marker}
            ## RSH CI Gate Report
            ### Release Gate: ${summaryBadge}

            | Step | Status | Duration |
            |---|---|---|
            ${stepRows}

            ${failedStepBlock}

            ### Timing
            - Total gate time: \`${totalGateTime}\`
            - Slowest steps:
            ${slowestStepLines}

            ### Debug Links
            - Workflow logs: [open run logs](${report.runUrl})
            - Playwright artifacts: ${playwrightArtifactsLine}

            - Run: [#${report.runNumber}](${report.runUrl})
            - Commit: \`${report.sha.slice(0, 12)}\`
            - Artifact: [ci-release-gate-report.json](${process.env.ARTIFACT_URL})
            - Generated: \`${report.generatedAt}\`
            `;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100
            });

            const existing = comments.find(
              (comment) => comment.user?.type === "Bot" && comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }

