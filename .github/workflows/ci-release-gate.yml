name: CI Release Gate

on:
  push:
    branches:
      - master
      - develop
  pull_request:

concurrency:
  group: ci-release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rsh_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/rsh_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci_jwt_access_secret_at_least_32_chars_long____
      JWT_REFRESH_SECRET: ci_jwt_refresh_secret_at_least_32_chars_long___
      JWT_KEY_ID: ci-key-1
      REFRESH_TOKEN_PEPPER: ci_refresh_pepper_1234567890
      ACCESS_TOKEN_TTL_SECONDS: "900"
      REFRESH_TOKEN_TTL_DAYS: "14"
      COOKIE_DOMAIN: localhost
      STRIPE_SECRET_KEY: sk_test_ci_dummy_key
      STRIPE_WEBHOOK_SECRET: whsec_ci_dummy_secret
      STRIPE_PRICE_CURRENCY: usd
      STORE_USD_TO_RUB_RATE: "90"
      PLAYWRIGHT_TEST: "1"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rsh_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rsh_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Prepare database
        run: npm run prisma:generate && npm run prisma:deploy && npm run seed

      - name: Run DB preflight
        run: npm run db:preflight

      - name: Run typecheck
        run: npm run typecheck

      - name: Run lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test

      - name: Run build
        run: npm run build

      - name: Run E2E security gate
        run: npm run test:e2e:security

      - name: Run E2E smoke
        run: npm run test:e2e:smoke
