name: CI Preview Smoke

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: ci-preview-smoke-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview-smoke:
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rsh_preview?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/rsh_preview?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci_jwt_access_secret_at_least_32_chars_long____
      JWT_REFRESH_SECRET: ci_jwt_refresh_secret_at_least_32_chars_long___
      JWT_KEY_ID: ci-key-1
      REFRESH_TOKEN_PEPPER: ci_refresh_pepper_1234567890
      ACCESS_TOKEN_TTL_SECONDS: "900"
      REFRESH_TOKEN_TTL_DAYS: "14"
      COOKIE_DOMAIN: localhost
      STRIPE_SECRET_KEY: sk_test_ci_dummy_key
      STRIPE_WEBHOOK_SECRET: whsec_ci_dummy_secret
      STRIPE_PRICE_CURRENCY: usd
      STORE_USD_TO_RUB_RATE: "90"
      PLAYWRIGHT_TEST: "1"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rsh_preview
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rsh_preview"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        id: setup_node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        id: install_dependencies
        run: npm ci

      - name: Install Playwright browser
        id: install_playwright
        run: npx playwright install --with-deps chromium

      - name: Prepare database
        id: prepare_database
        run: npm run prisma:generate && npm run prisma:deploy && npm run seed

      - name: Run DB preflight
        id: db_preflight
        run: npm run db:preflight

      - name: Run E2E security gate
        id: e2e_security
        run: npm run test:e2e:security

      - name: Run preview smoke
        id: e2e_smoke
        run: npm run test:e2e:smoke

      - name: Build CI preview report
        if: ${{ always() }}
        env:
          PREPARE_DATABASE_OUTCOME: ${{ steps.prepare_database.outcome }}
          DB_PREFLIGHT_OUTCOME: ${{ steps.db_preflight.outcome }}
          E2E_SECURITY_OUTCOME: ${{ steps.e2e_security.outcome }}
          E2E_SMOKE_OUTCOME: ${{ steps.e2e_smoke.outcome }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          node - <<'NODE'
          const fs = require("fs");

          const steps = {
            prepare_database: process.env.PREPARE_DATABASE_OUTCOME ?? "skipped",
            db_preflight: process.env.DB_PREFLIGHT_OUTCOME ?? "skipped",
            e2e_security: process.env.E2E_SECURITY_OUTCOME ?? "skipped",
            e2e_smoke: process.env.E2E_SMOKE_OUTCOME ?? "skipped"
          };

          const gateOrder = ["prepare_database", "db_preflight", "e2e_security", "e2e_smoke"];
          const gatePassed = gateOrder.every((key) => steps[key] === "success");

          const report = {
            workflow: process.env.WORKFLOW_NAME,
            runId: process.env.RUN_ID,
            runNumber: process.env.RUN_NUMBER,
            sha: process.env.SHA,
            refName: process.env.REF_NAME,
            actor: process.env.ACTOR,
            repository: process.env.REPOSITORY,
            runUrl: `${process.env.SERVER_URL}/${process.env.REPOSITORY}/actions/runs/${process.env.RUN_ID}`,
            generatedAt: new Date().toISOString(),
            status: gatePassed ? "passed" : "failed",
            steps
          };

          fs.writeFileSync("ci-preview-smoke-report.json", JSON.stringify(report, null, 2));
          NODE

      - name: Upload CI preview report artifact
        id: upload_preview_report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-preview-smoke-report-${{ github.run_id }}
          path: ci-preview-smoke-report.json
          if-no-files-found: error

      - name: Publish preview summary comment
        if: ${{ always() && github.event.pull_request.head.repo.fork == false }}
        uses: actions/github-script@v7
        env:
          REPORT_PATH: ci-preview-smoke-report.json
          ARTIFACT_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/${{ steps.upload_preview_report.outputs.artifact-id }}
        with:
          script: |
            const fs = require("fs");
            const report = JSON.parse(fs.readFileSync(process.env.REPORT_PATH, "utf8"));
            const marker = "<!-- rsh-preview-smoke-summary -->";

            const toEmoji = (status) => {
              if (status === "success") return "[OK]";
              if (status === "failure") return "[FAIL]";
              if (status === "cancelled") return "[CANCEL]";
              return "[SKIP]";
            };

            const stepRows = [
              ["Prepare database", report.steps.prepare_database],
              ["DB preflight", report.steps.db_preflight],
              ["E2E security gate", report.steps.e2e_security],
              ["E2E smoke", report.steps.e2e_smoke]
            ]
              .map(([name, status]) => `| ${name} | ${toEmoji(status)} \`${status}\` |`)
              .join("\n");

            const summaryBadge = report.status === "passed" ? "[OK] PASSED" : "[FAIL] FAILED";
            const body = `${marker}
            ## Preview Smoke Summary: ${summaryBadge}

            | Step | Status |
            |---|---|
            ${stepRows}

            - Run: [#${report.runNumber}](${report.runUrl})
            - Commit: \`${report.sha.slice(0, 12)}\`
            - Artifact: [ci-preview-smoke-report.json](${process.env.ARTIFACT_URL})
            - Generated: \`${report.generatedAt}\`
            `;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100
            });

            const existing = comments.find(
              (comment) => comment.user?.type === "Bot" && comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }

